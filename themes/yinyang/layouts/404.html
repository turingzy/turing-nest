{{ define "main" }}
<article class="post {{ .Site.Language.Label }}" id="article">
    <div class="row">
      <div class="col-xs-12">
        <div class="site-header">
          {{ partial "header.html" . }}
        </div>

        <div class="post-content markdown-body not-found">
          <h1 class="not-found-code">404</h1>
          <p class="not-found-message">
            抱歉，您访问的页面不存在或已被移除。
          </p>
          {{ with .Site.Params.author.email }}
          <p class="not-found-hint">
            如有疑问，欢迎邮件联系 <a href="mailto:{{ . }}">{{ . }}</a>
          </p>
          {{ end }}
        </div>

        {{ partial "footer.html" . }}
      </div>
    </div>
  </article>
{{ end }}
